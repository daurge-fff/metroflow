name: Release (desktop, cloud build)

# Optional: build desktop binaries in the cloud and attach them to a release.
# The recommended way to cut a release is `scripts/package_releases.sh` +
# `gh release create` (that also produces the macOS .dmg and the Android APK).
# This workflow is manual so it never duplicates assets automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.16.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release
          mkdir -p out
          cp target/release/metroflow out/MetroFlow-linux-x86_64

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release
          mkdir out
          copy target\release\metroflow.exe out\MetroFlow-windows-x86_64.exe

      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p out
          lipo -create \
            target/aarch64-apple-darwin/release/metroflow \
            target/x86_64-apple-darwin/release/metroflow \
            -output out/MetroFlow-macos-universal
          chmod +x out/MetroFlow-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  attach:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
